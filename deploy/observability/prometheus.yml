global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: rag

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: rag-application-otlp
    scrape_native_histograms: true
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: tempo
    scrape_native_histograms: true
    static_configs:
      - targets: [tempo:3200]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

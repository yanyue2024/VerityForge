name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate evaluation benchmark
        run: ./scripts/validate-evaluation-blueprint.sh
      - name: Validate observability configuration
        run: ./scripts/validate-observability.sh --static
      - name: Verify Java modules
        run: ./mvnw verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run typecheck && npm run build
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e -- --project=desktop

  parser-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser-sidecar/pyproject.toml
      - name: Install parser
        working-directory: parser-sidecar
        run: pip install ".[test]"
      - name: Lint and test
        working-directory: parser-sidecar
        run: ruff check src tests && pytest

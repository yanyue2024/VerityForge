spring:
  application:
    name: rag-worker
  main:
    web-application-type: none
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DATABASE_USERNAME:rag}
    password: ${DATABASE_PASSWORD:rag}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

management:
  metrics:
    distribution:
      percentiles-histogram:
        rag.ingestion.stage: true
        rag.model.request: true
  otlp:
    metrics:
      export:
        enabled: ${RAG_OTLP_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${RAG_OTLP_METRICS_STEP:15s}
  logging:
    export:
      otlp:
        enabled: ${RAG_OTLP_LOGGING_ENABLED:false}
  tracing:
    sampling:
      probability: ${RAG_TRACE_SAMPLE_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${RAG_OTLP_TRACING_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: rag-platform
      deployment.environment: ${RAG_DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

rag:
  governance:
    expiration-scan-interval-ms: ${RAG_GOVERNANCE_EXPIRATION_SCAN_INTERVAL_MS:60000}
    version-retention-days: ${RAG_GOVERNANCE_VERSION_RETENTION_DAYS:30}
    cleanup-batch-size: ${RAG_GOVERNANCE_CLEANUP_BATCH_SIZE:50}
    cleanup-initial-delay-ms: ${RAG_GOVERNANCE_CLEANUP_INITIAL_DELAY_MS:120000}
    cleanup-delay-ms: ${RAG_GOVERNANCE_CLEANUP_DELAY_MS:86400000}
  credentials:
    active-key-id: ${RAG_CREDENTIAL_ACTIVE_KEY_ID:primary}
    master-key: ${RAG_CREDENTIAL_MASTER_KEY:}
    decryption-keys: ${RAG_CREDENTIAL_DECRYPTION_KEYS:}
  models:
    inference-connect-timeout-seconds: ${RAG_MODEL_INFERENCE_CONNECT_TIMEOUT_SECONDS:10}
    inference-request-timeout-seconds: ${RAG_MODEL_INFERENCE_REQUEST_TIMEOUT_SECONDS:90}
    proxy-url: ${RAG_MODEL_PROXY_URL:}
    no-proxy-hosts: ${RAG_MODEL_NO_PROXY_HOSTS:localhost,127.0.0.1,::1,postgres,redis,minio,model-sidecar,parser-sidecar}
    structured-max-tokens: ${RAG_MODEL_STRUCTURED_MAX_TOKENS:2200}
    structured-reasoning-effort: ${RAG_MODEL_STRUCTURED_REASONING_EFFORT:}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:ragadmin}
    secret-key: ${MINIO_SECRET_KEY:ragadmin123}
    bucket: ${MINIO_BUCKET:rag-assets}
    connect-timeout-seconds: ${RAG_STORAGE_CONNECT_TIMEOUT_SECONDS:3}
    attempt-timeout-seconds: ${RAG_STORAGE_ATTEMPT_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${RAG_STORAGE_REQUEST_TIMEOUT_SECONDS:30}
  ingestion:
    stream: ${RAG_INGESTION_STREAM:rag:ingestion}
    consumer-group: ${RAG_INGESTION_CONSUMER_GROUP:rag-workers}
    consumer-name: ${RAG_INGESTION_CONSUMER_NAME:worker-main}
    poll-delay-ms: ${RAG_INGESTION_POLL_DELAY_MS:500}
    claim-idle-ms: ${RAG_INGESTION_CLAIM_IDLE_MS:30000}
    claim-batch-size: ${RAG_INGESTION_CLAIM_BATCH_SIZE:4}
    stale-after-seconds: ${RAG_INGESTION_STALE_AFTER_SECONDS:300}
    heartbeat-interval-seconds: ${RAG_INGESTION_HEARTBEAT_INTERVAL_SECONDS:30}
    embedding-batch-size: ${RAG_INGESTION_EMBEDDING_BATCH_SIZE:32}
    normalized-artifact-reuse-enabled: ${RAG_INGESTION_NORMALIZED_ARTIFACT_REUSE_ENABLED:true}
  index-rebuild:
    poll-delay-ms: ${RAG_INDEX_REBUILD_POLL_DELAY_MS:1000}
    batch-size: ${RAG_INDEX_REBUILD_BATCH_SIZE:32}
    stale-after-seconds: ${RAG_INDEX_REBUILD_STALE_AFTER_SECONDS:900}
    recovery-delay-ms: ${RAG_INDEX_REBUILD_RECOVERY_DELAY_MS:60000}
    retention-days: ${RAG_INDEX_RETENTION_DAYS:30}
    cleanup-initial-delay-ms: ${RAG_INDEX_CLEANUP_INITIAL_DELAY_MS:60000}
    cleanup-delay-ms: ${RAG_INDEX_CLEANUP_DELAY_MS:86400000}
  parser:
    sidecar-url: ${PARSER_SIDECAR_URL:}
    sidecar-timeout-seconds: ${PARSER_SIDECAR_TIMEOUT_SECONDS:90}
    sparse-pdf-characters-per-page: ${PARSER_SPARSE_PDF_CHARACTERS_PER_PAGE:40}

logging:
  level:
    org.jooq.tools.LoggerListener: WARN
